name: Keep newest Actions artifacts

on:
  workflow_run:
    workflows: ["Build Cart Studio"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/artifact-cleanup.yml']

permissions:
  actions: write

concurrency:
  group: keep-newest-actions-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Uses API metadata only; never checks out or executes triggering-run code.
      - uses: actions/github-script@v8
        with:
          script: |
            const repo = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...repo, per_page: 100});
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...repo, per_page: 100});
            const byRun = new Map(runs.map(r => [r.id, r]));
            const groups = new Map();
            for (const artifact of artifacts) {
              const run = byRun.get(artifact.workflow_run?.id);
              if (!run) continue;
              const key = JSON.stringify([run.workflow_id, artifact.name]);
              if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push({artifact, run});
            }
            for (const entries of groups.values()) {
              const good = entries.filter(({artifact, run}) =>
                !artifact.expired && run.status === 'completed' && run.conclusion === 'success');
              good.sort((a, b) => b.run.id - a.run.id || b.artifact.id - a.artifact.id);
              if (!good.length) continue;
              const keep = good[0].artifact;
              core.info(`Keeping ${keep.name} (${keep.id})`);
              for (const {artifact, run} of entries) {
                if (artifact.id === keep.id || run.status !== 'completed') continue;
                core.info(`Deleting superseded ${artifact.name} (${artifact.id})`);
                await github.rest.actions.deleteArtifact({...repo, artifact_id: artifact.id});
              }
            }

