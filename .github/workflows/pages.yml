name: Build Cart Studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build browser app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: slot-cart-studio
      - id: pin
        run: |
          echo "ref=$(cat slot-cart-studio/slot.ref)" >> "$GITHUB_OUTPUT"
          echo "repository=$(cat slot-cart-studio/slot.repo)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.ref }}
          path: slot
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Rust and WebAssembly target
        run: rustup toolchain install 1.96 --profile minimal --target wasm32-unknown-unknown
      - name: Check JavaScript and card handling
        working-directory: slot-cart-studio
        run: |
          for file in web/*.js; do node --input-type=module --check < "$file"; done
          node --test web/*.test.mjs
      - name: Test label generation and cartridge previews
        working-directory: slot-cart-studio
        run: |
          cargo test --locked
          cargo run --locked --example renderer_preview -- "$RUNNER_TEMP/studio-previews"
      - uses: actions/upload-artifact@v7
        with:
          name: cart-studio-previews
          path: ${{ runner.temp }}/studio-previews
          if-no-files-found: error
      - name: Install wasm-pack
        run: |
          set -eu
          curl -fsSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-pack-v0.15.0-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Build browser app
        working-directory: slot-cart-studio
        run: |
          set -eu
          wasm-pack build --release --target web --no-typescript --out-dir web/pkg
          sed -i "s/^const BUILD = 'dev';\$/const BUILD = '$GITHUB_SHA';/" web/studio.js
          cp LICENSE web/LICENSE
      - name: Check browser rendering and artwork choices
        working-directory: slot-cart-studio
        env:
          NODE_PATH: ${{ runner.temp }}/studio-browser/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/studio-browser" playwright@1.62.1
          python3 -m pip install pillow==13.0.0
          python3 tools/mirror_art.py web/art --sample 2
          node tools/browser-renderer.cjs "$RUNNER_TEMP/studio-previews"
          python3 - <<'PYTEST'
          from pathlib import Path
          import zipfile, struct
          with zipfile.ZipFile(Path(__import__('os').environ['RUNNER_TEMP']) / 'studio-previews' / 'labels.zip') as zipped:
              images = [n for n in zipped.namelist() if n.endswith('.png')]
              assert images
              for name in images:
                  data = zipped.read(name)
                  assert data[25] == 6, (name, 'cleaned label must keep RGBA transparency')
          PYTEST
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cart-studio-browser-review
          path: ${{ runner.temp }}/studio-previews
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: cart-studio-web
          path: slot-cart-studio/web
          if-no-files-found: error
